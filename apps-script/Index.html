<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Family Finance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface2:#eef1f4; --text:#0f172a; --muted:#5b6678; --line:#e1e5ea;
  --primary:#0f766e; --primary-2:#0369a1; --primary-ink:#ffffff; --primary-soft:#d9f2ee;
  --income:#047857; --expense:#b91c1c; --warn:#b45309; --warn-soft:#fef3c7; --over-soft:#fee2e2; --ok-soft:#dcfce7;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
  --r:14px; --nav:64px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0b1220; --surface:#131c2e; --surface2:#1b2740; --text:#e8edf5; --muted:#9aa7bd; --line:#26334d;
    --primary:#2dd4bf; --primary-2:#38bdf8; --primary-ink:#06231f; --primary-soft:#123a3a; --income:#34d399; --expense:#f87171;
    --warn:#fbbf24; --warn-soft:#3a2d0b; --over-soft:#451a1a; --ok-soft:#0f3324; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Lexend,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
#app{max-width:720px;margin:0 auto;padding:12px 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom))}
h1{font-size:1.25rem;margin:4px 0 12px}
h2{font-size:1rem;margin:20px 0 8px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.top .who{color:var(--muted);font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.hero{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:var(--primary-ink);border:none}
.hero .lbl{opacity:.85;font-size:.85rem}
.hero .big{font-size:1.9rem;font-weight:700;letter-spacing:-.01em;margin:2px 0 6px}
.hero .sub{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;opacity:.95}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .lbl{font-size:.75rem;color:var(--muted)}
.kpi .val{font-weight:600;font-size:.88rem;white-space:nowrap}
.inc{color:var(--income)} .exp{color:var(--expense)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .l{min-width:0;flex:1}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted)}
.row .r{text-align:right;font-weight:600;white-space:nowrap}
.tap{width:100%;background:none;border:none;text-align:left;padding:0;display:block}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.over{background:var(--over-soft);color:var(--expense)} .pill.ok{background:var(--ok-soft);color:var(--income)}
.bar{height:16px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .2s}
.alert{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:.9rem}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.over{background:var(--over-soft);color:var(--expense)} .alert.info{background:var(--surface2)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav .in{display:flex;width:100%;max-width:720px}
nav button{flex:1;height:var(--nav);background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem}
nav button[aria-current=page]{color:var(--primary);font-weight:600}
nav button.side-only{display:none}
nav button.add span.fab{width:48px;height:48px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibadge{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--muted)}
.ibadge svg.i{width:19px;height:19px}
.ibadge.inc{background:var(--ok-soft);color:var(--income)}
.ibadge.exp{background:var(--over-soft);color:var(--expense)}
.ibadge.neu{background:var(--primary-soft);color:var(--primary)}
.nw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.nw-col{display:flex;flex-direction:column;gap:12px}
.nw-col-title{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px}
.nw-item{display:flex;align-items:center;gap:10px}
.nw-item .t{font-size:.78rem;color:var(--muted);margin-bottom:1px}
.nw-item .v{font-weight:700;font-size:.92rem;line-height:1.25}
@media(min-width:900px){.nw-item .v{font-size:1rem}}
.row.has-icon{gap:12px}
.subtabs{display:flex;gap:8px;margin:12px 0 10px}
.subtabs button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem;display:flex;align-items:center;justify-content:center;gap:6px}
.subtabs button[aria-selected=true]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.subtabs svg.i{width:16px;height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);min-height:40px}
.chip[aria-pressed=true]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.toggle2{display:flex;gap:8px}
.toggle2 button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.toggle2 button[aria-pressed=true]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
label.f{display:block;margin:8px 0 3px;font-size:.85rem;color:var(--muted)}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);}
textarea{min-height:64px;resize:vertical}
input.amount{font-size:1.7rem;font-weight:700;text-align:right;padding:8px 10px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow .f{margin:0}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger{color:var(--expense)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.block{width:100%;margin-top:16px}
.btns{display:flex;gap:10px;margin-top:16px} .btns .btn{flex:1}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.err{background:var(--over-soft);color:var(--expense);padding:10px 12px;border-radius:10px;margin-top:12px;font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.skel{height:80px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}*{scroll-behavior:auto!important}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 18px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;max-width:90%;font-size:.9rem}
.seg{display:flex;gap:8px;align-items:center;justify-content:space-between}
.seg .btn{min-height:40px;padding:0 12px}
.link{background:none;border:none;color:var(--primary);padding:6px 0;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sr{position:absolute;left:-9999px}
.filterbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}
.filterbar .btn{display:flex;align-items:center;gap:8px}
.fcount{background:var(--primary);color:var(--primary-ink);border-radius:99px;min-width:18px;height:18px;padding:0 5px;font-size:.7rem;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.jarsvg{width:40px;height:56px;flex:none;filter:drop-shadow(0 3px 5px rgba(15,23,42,.2))}
.ss{position:relative}
.ss-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:220px;overflow:auto;z-index:25}
.ss-opt{display:block;width:100%;text-align:left;padding:10px 12px;border:none;border-bottom:1px solid var(--line);background:var(--surface)}
.ss-opt:last-child{border-bottom:none}
.ss-opt:hover{background:var(--surface2)}
.ss-empty{padding:10px 12px;color:var(--muted);font-size:.85rem}
/* Web/desktop: sidebar điều hướng bên trái, nội dung rộng hơn thay vì hẹp căn giữa kiểu điện thoại,
   chữ to hơn cho dễ đọc trên màn hình lớn. */
@media (min-width:900px){
  html,body{font-size:18px}
  #app{width:calc(100% - 232px);max-width:1360px;margin:0 0 0 232px;padding:30px 36px 48px}
  nav{left:0;right:auto;top:0;bottom:0;width:232px;border-top:none;border-right:1px solid var(--line);justify-content:flex-start;padding:20px 12px env(safe-area-inset-bottom)}
  nav .in{flex-direction:column;max-width:none;width:100%;gap:3px}
  nav button{flex:none;height:46px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 12px;border-radius:12px;font-size:.92rem;order:9}
  nav button:hover{background:var(--surface2)}
  nav button[aria-current=page]{background:var(--primary-soft)}
  nav button.add{margin-bottom:0;background:var(--primary);color:var(--primary-ink);font-weight:600}
  nav button.add span.fab{width:32px;height:32px;margin-top:0;box-shadow:none}
  nav button.side-only{display:flex}
  /* Thứ tự riêng cho sidebar: Nhập đứng ngay dưới Tổng quan; Ví/Tài sản/Khoản vay/Sổ nợ là module
     riêng chỉ hiện ở đây (điện thoại vẫn giữ nút + nổi giữa thanh dưới và có lối tắt từ Tổng quan). */
  nav button[aria-label="Tổng quan"]{order:1}
  nav button[aria-label="Nhập"]{order:2}
  nav button[aria-label="Lịch sử"]{order:3}
  nav button[aria-label="Ngân sách"]{order:4}
  nav button[aria-label="Ví"]{order:5}
  nav button[aria-label="Tài sản"]{order:6}
  nav button[aria-label="Khoản vay"]{order:7}
  nav button[aria-label="Sổ nợ"]{order:8}
  nav button[aria-label="Admin"]{order:9}
  .sheet-bg{align-items:center;padding:20px}
  .sheet{border-radius:18px;max-width:480px;max-height:85vh}
  .grid3{grid-template-columns:repeat(3,1fr)}
  .chips{overflow-x:visible;flex-wrap:wrap}
}
</style>

<body>
<div id="app" role="main"></div>
<nav aria-label="Điều hướng chính"><div class="in" id="nav"></div></nav>
<div id="live" class="sr" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
var $app=document.getElementById('app');
var S={boot:null,tab:'home',period:null,view:{},busy:false,cache:{},inflight:{}};
var KIND_COLOR={income:'inc',refund:'inc',asset_sale:'inc',expense:'exp',asset_purchase:'exp',loan_payment:'exp'};

// ---- client-side cache: in-memory (S.cache) + persisted to localStorage so the app still shows
// last-known numbers immediately on a cold open, before the server round-trip finishes. ----
var FF_LS_KEY='ff_cache_v1';
function loadCacheLS(){
  try{ var raw=localStorage.getItem(FF_LS_KEY); if(raw){ var o=JSON.parse(raw); if(o&&typeof o==='object')S.cache=o; } }catch(e){}
}
function saveCacheLS(){
  try{
    var keys=Object.keys(S.cache);
    // Cache keys embed the period (yyyy-mm) and sort lexically oldest-first, so once there are
    // many months of history this keeps only the most recent ~60 entries instead of growing forever.
    if(keys.length>60){ keys.sort(); keys.slice(0,keys.length-60).forEach(function(k){delete S.cache[k];}); }
    localStorage.setItem(FF_LS_KEY,JSON.stringify(S.cache));
  }catch(e){}
}
// Runs fetchFn at most once per key at a time; a second caller (e.g. a background prefetch and a
// render that both want "dashboard:2026-11" right after app open) shares the same network call.
function fetchOnce(key,fetchFn){
  if(S.inflight[key])return S.inflight[key];
  var p=fetchFn().then(function(data){ S.cache[key]=data; saveCacheLS(); delete S.inflight[key]; return data; },function(e){ delete S.inflight[key]; throw e; });
  S.inflight[key]=p; return p;
}
// Shows cached data instantly (no skeleton) while a fresh copy loads silently behind it.
// First visit to a key still shows the loading skeleton since there is nothing to show yet.
// `relevant` (optional) is checked before the fresh data is painted, so a slow response doesn't
// overwrite whatever screen the person has since navigated to.
function withCache(key,fetchFn,renderFn,failRenderFn,relevant){
  var hit=S.cache[key];
  if(hit!==undefined)renderFn(hit); else loading();
  fetchOnce(key,fetchFn).then(function(data){ if(!relevant||relevant())renderFn(data); },function(e){ if(hit===undefined)(failRenderFn||fail)(e,function(){withCache(key,fetchFn,renderFn,failRenderFn,relevant);}); });
}
// Silently warms the cache in the background (no render) - used right after app open to make
// switching to Ngân sách / Lịch sử feel instant even though the person hasn't opened them yet.
function prefetch(key,fetchFn){ fetchOnce(key,fetchFn).catch(function(){}); }
// Call after any action that changes balances/budget/transactions, before re-rendering, so the
// next render fetches fresh numbers instead of briefly flashing the now-stale cached ones.
function invalidateCache(){ S.cache={}; S.inflight={}; saveCacheLS(); }
function prefetchAll(){
  var p=S.period; if(!p)return;
  prefetch('budget:'+p,function(){return api('budget',{period:p});});
  prefetch('txns:'+p+'|||',function(){return api('txns',{period:p,kind:'',wallet_id:'',q:'',limit:200});});
}

function h(tag,attrs,kids){
  var el=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){
    var v=attrs[k]; if(v===null||v===undefined||v===false)return;
    if(k==='class')el.className=v; else if(k==='text')el.textContent=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(v===true)el.setAttribute(k,''); else el.setAttribute(k,v);
  });
  (kids||[]).forEach(function(c){ if(c===null||c===undefined||c===false)return; el.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return el;
}
function svg(path){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','i');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');s.innerHTML=path;return s;}
var ICON={
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  jar:'<path d="M7 3h10v3H7z"/><path d="M6 6h12v3a3 3 0 013 3v6a3 3 0 01-3 3H6a3 3 0 01-3-3v-6a3 3 0 013-3z"/>',
  more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82A1.65 1.65 0 003 13.09H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/>',
  bell:'<path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/>',
  cash:'<rect x="2.5" y="6.5" width="19" height="11" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M5.5 6.5v.01M18.5 17.5v.01"/>',
  bank:'<path d="M3 10l9-6 9 6"/><path d="M4 10v9M9 10v9M15 10v9M20 10v9"/><path d="M3 21h18"/>',
  savings:'<path d="M4 13c0-4 3-7 8-7 2 0 3.5.6 4.5 1.5L20 7v4l-2 1v2.5c0 1-1 2-2 2h-1l-1 3H9l-.5-2c-2.5-.5-4.5-2.5-4.5-4.5z"/><circle cx="15" cy="8.5" r="0.6"/>',
  trust:'<path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/>',
  up:'<circle cx="12" cy="12" r="9.5"/><path d="M12 16V8M8.5 11.5L12 8l3.5 3.5"/>',
  down:'<circle cx="12" cy="12" r="9.5"/><path d="M12 8v8M8.5 12.5L12 16l3.5-3.5"/>',
  swap:'<path d="M4 7h13M13 3l4 4-4 4"/><path d="M20 17H7M11 21l-4-4 4-4"/>',
  undo:'<path d="M3 11a8 8 0 1 1 2.3 5.6"/><path d="M3 5v6h6"/>',
  sliders:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="1.7"/><circle cx="16" cy="12" r="1.7"/><circle cx="7" cy="18" r="1.7"/>',
  card:'<rect x="2.5" y="5.5" width="19" height="13" rx="2"/><path d="M2.5 9.5h19"/><path d="M6 14h4"/>',
  box:'<path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  people:'<circle cx="8" cy="8" r="3.2"/><path d="M2.5 19c0-3.5 2.6-5.6 5.5-5.6s5.5 2.1 5.5 5.6"/><circle cx="17" cy="9" r="2.6"/><path d="M14.5 19c.2-2.8 1.8-4.6 4-4.6"/>',
  filter:'<path d="M4 5h16l-6 8v6l-4-2v-4z"/>'
};
var WALLET_ICON={cash:'cash',bank:'bank',savings:'savings',held_in_trust:'trust'};
var KIND_ICON={income:'up',refund:'up',asset_sale:'up',expense:'down',asset_purchase:'down',transfer:'swap',adjustment:'sliders',loan_payment:'card',liability_adjustment:'sliders',reversal:'undo',debt_lend:'down',debt_borrow:'up',debt_collect:'up',debt_repay:'down',debt_adjustment:'sliders'};
function iconBadge(iconKey,tone,colorHex){
  var a={class:'ibadge '+(tone||'')};
  if(colorHex)a.style='background:'+colorHex+'22;color:'+colorHex;
  return h('span',a,[svg(ICON[iconKey]||ICON.box)]);
}
// Màu cố định theo tên (danh mục/lọ) để các dòng giao dịch dễ phân biệt hơn, không cần
// khai báo cứng danh mục nào — tự tính từ tên nên danh mục nào cũng ra màu nhất quán.
var CAT_PALETTE=['#2563eb','#7c3aed','#db2777','#ea580c','#16a34a','#0891b2','#ca8a04','#64748b','#dc2626','#059669'];
function catColor(key){
  var s=String(key||''),hsh=0;
  for(var i=0;i<s.length;i++)hsh=(hsh*31+s.charCodeAt(i))>>>0;
  return CAT_PALETTE[hsh%CAT_PALETTE.length];
}
function fmt(n){ if(n===null||n===undefined||isNaN(n))return '—'; var neg=n<0; var s=Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); return (neg?'-':'')+s+' ₫'; }
function fmtSigned(n){ return (n>0?'+':'')+fmt(n); }
function ymdParts(s){var p=String(s).split('-');return {y:+p[0],m:+p[1],d:+p[2]};}
function dmy(s){ if(!s)return ''; var p=ymdParts(s); return p.d+'/'+p.m+'/'+p.y; }
function periodLabel(p){ var x=p.split('-'); return 'Tháng '+(+x[1])+'/'+x[0]; }
function shiftPeriod(p,d){ var x=p.split('-').map(Number); var t=x[0]*12+(x[1]-1)+d; return Math.floor(t/12)+'-'+String(t%12+1).padStart(2,'0'); }
function uid(){ try{ if(window.crypto&&crypto.randomUUID)return crypto.randomUUID(); }catch(e){} return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); }
function say(msg){ document.getElementById('live').textContent=msg; }
function toast(msg){ var t=h('div',{class:'toast',role:'status',text:msg}); document.body.appendChild(t); say(msg); setTimeout(function(){t.remove();},3200); }
function digits(v){ return String(v||'').replace(/\D/g,''); }

/* ---------- API ---------- */
function api(name,payload){
  return new Promise(function(resolve,reject){
    if(!window.google||!google.script||!google.script.run){ reject(new Error('Không kết nối được máy chủ.')); return; }
    google.script.run
      .withSuccessHandler(function(txt){
        var r; try{ r=JSON.parse(txt); }catch(e){ reject(new Error('Phản hồi không hợp lệ.')); return; }
        if(r.ok)resolve(r.data); else { var er=new Error(r.error||'Có lỗi.'); er.code=r.code; reject(er); }
      })
      .withFailureHandler(function(e){ reject(new Error((e&&e.message)||'Mất kết nối. Thử lại.')); })
      .apiCall(name,JSON.stringify(payload||{}));
  });
}

/* ---------- sheet (modal) ---------- */
function openSheet(title,body){
  var bg=h('div',{class:'sheet-bg',role:'dialog','aria-modal':'true','aria-label':title});
  var sh=h('div',{class:'sheet'},[h('div',{class:'seg'},[h('h3',{text:title}),h('button',{class:'btn',type:'button','aria-label':'Đóng',text:'Đóng',onclick:close})]),body]);
  function close(){ bg.remove(); document.removeEventListener('keydown',esc); }
  function esc(e){ if(e.key==='Escape')close(); }
  bg.addEventListener('click',function(e){ if(e.target===bg)close(); });
  document.addEventListener('keydown',esc);
  bg.appendChild(sh); document.body.appendChild(bg);
  return {close:close};
}

function moneyInput(initial,id){
  var i=h('input',{class:'amount',id:id||'amt',inputmode:'numeric',autocomplete:'off',placeholder:'0','aria-label':'Số tiền (đồng)'});
  i.value=initial?String(initial).replace(/\B(?=(\d{3})+(?!\d))/g,','):'';
  i.addEventListener('input',function(){ var d=digits(i.value); i.value=d?d.replace(/\B(?=(\d{3})+(?!\d))/g,','):''; });
  i.getNumber=function(){ var d=digits(i.value); return d?Number(d):0; };
  return i;
}
function selectEl(opts,value,id){
  var s=h('select',{id:id},opts.map(function(o){ return h('option',{value:o.v,text:o.t}); }));
  if(value!==undefined&&value!==null)s.value=value; return s;
}
// Ô chọn gõ-để-lọc: gõ vài chữ sẽ thu hẹp danh sách, bấm chọn hoặc gõ đúng tên để xác nhận.
// Hoạt động như select (đọc .value, bắt sự kiện 'change') để dùng chung được với fld()/payload().
function searchSelect(opts,value,idPrefix,placeholder){
  var wrap=h('div',{class:'ss',id:idPrefix});
  wrap.value=value||'';
  function labelOf(v){ var o=opts.filter(function(x){return x.v===v;})[0]; return o?o.t:''; }
  var inp=h('input',{type:'text',autocomplete:'off',placeholder:placeholder||'Gõ để tìm…',value:labelOf(wrap.value)});
  var list=h('div',{class:'ss-list'});
  list.style.display='none';
  function renderList(q){
    var ql=(q||'').toLowerCase();
    var matches=opts.filter(function(o){return o.v&&(!ql||o.t.toLowerCase().indexOf(ql)>=0);}).slice(0,40);
    if(!matches.length){ list.replaceChildren(h('div',{class:'ss-empty',text:'Không tìm thấy'})); return; }
    list.replaceChildren.apply(list,matches.map(function(o){
      return h('button',{type:'button',class:'ss-opt',text:o.t,onclick:function(){ wrap.value=o.v; inp.value=o.t; list.style.display='none'; wrap.dispatchEvent(new Event('change')); }});
    }));
  }
  inp.addEventListener('focus',function(){ list.style.display='block'; renderList(''); inp.select(); });
  inp.addEventListener('input',function(){ wrap.value=''; renderList(inp.value); });
  inp.addEventListener('blur',function(){ setTimeout(function(){
    if(!wrap.value){ var exact=opts.filter(function(o){return o.t===inp.value;})[0]; if(exact){wrap.value=exact.v;} else { inp.value=''; wrap.value=''; } }
    list.style.display='none';
  },180); });
  wrap.append(inp,list);
  return wrap;
}
// Ô chọn ví: mặc định chỉ hiện ví của người đang đăng nhập + ví chung (không gán chủ sở hữu riêng);
// bấm "… thêm ví khác" để mở rộng xem cả ví của người còn lại.
function walletField(selectedId,idPrefix){
  var me=S.boot.me.member_id, all=walletOpts();
  var mine=walletOpts(function(w){return !w.owner_member_id||w.owner_member_id===me;});
  var wrap=h('div',{class:'ss',id:idPrefix});
  var expanded=selectedId?!mine.some(function(o){return o.v===selectedId;}):false;
  function build(){
    var opts=expanded?all:mine;
    var sel=selectEl(opts,selectedId||'',idPrefix+'_sel');
    sel.addEventListener('change',function(){ selectedId=sel.value; wrap.value=sel.value; wrap.dispatchEvent(new Event('change')); });
    var kids=[sel];
    if(mine.length<all.length)kids.push(h('button',{type:'button',class:'link',style:'padding:4px 0 0;font-size:.8rem',text:expanded?'Chỉ hiện ví của tôi':'… thêm ví khác',onclick:function(){ expanded=!expanded; selectedId=sel.value; build(); }}));
    wrap.replaceChildren.apply(wrap,kids);
    wrap.value=sel.value;
  }
  build();
  return wrap;
}
function fld(label,input,hint){ return h('div',null,[h('label',{class:'f','for':input.id||null,text:label}),input,hint?h('div',{class:'hint',text:hint}):null]); }

function errBox(){ var e=h('div',{class:'err',role:'alert',hidden:true}); e.hidden=true; e.show=function(m){e.textContent=m;e.hidden=false;}; e.clear=function(){e.hidden=true;}; return e; }
function submitBtn(label,fn,err){
  var b=h('button',{class:'btn primary block',type:'button',text:label});
  b.addEventListener('click',function(){
    if(b.disabled)return; b.disabled=true; var old=b.textContent; b.textContent='Đang lưu…'; err.clear();
    Promise.resolve().then(fn).then(function(){ b.disabled=false; b.textContent=old; },function(e){ b.disabled=false; b.textContent=old; err.show(e.message); });
  });
  return b;
}

// Lọ ngân sách dạng thanh ngang (dày hơn bản gốc để nhìn rõ tiến trình). Mỗi lọ giữ 1 màu riêng
// (catColor) để phân biệt với lọ khác; trong chính màu đó, đã chi ít thì màu nhạt, chi nhiều thì
// đậm dần lên — độ đậm (opacity) tăng theo % ngân sách đã dùng. Vượt ngân sách thì luôn tô đậm hẳn
// màu cảnh báo (--expense) để không lẫn với các lọ còn bình thường.
function jarRow(j){
  var pct=Math.min(100,j.budget>0?Math.round(j.spent*100/j.budget):(j.spent>0?100:0));
  var over=j.status==='over';
  var color=over?'var(--expense)':catColor(j.name);
  var op=over?1:(0.32+Math.min(100,pct)/100*0.68).toFixed(2);
  // Chưa chi gì (pct=0) vẫn để một mẩu màu nhỏ đầu thanh, để lọ nào cũng còn nhận ra màu riêng
  // của mình thay vì biến mất hoàn toàn (thanh rộng 0 thì không thấy màu).
  var w=Math.max(pct,3);
  return h('div',{class:'row',style:'display:block;padding:10px 0'},[
    h('div',{class:'seg'},[h('span',{class:'t',text:j.name}),h('span',{class:'pill '+(j.status==='ok'?'':j.status),text:j.status==='over'?'Vượt':j.status==='warn'?'Gần hết':'Trong hạn mức'})]),
    h('div',{class:'bar'},[h('i',{style:'width:'+w+'%;background:'+color+';opacity:'+op})]),
    h('div',{class:'s',text:'Đã chi '+fmt(j.spent)+' / '+fmt(j.budget)+' · Còn '+fmt(j.remaining)+' · '+pct+'%'})
  ]);
}
function txnRow(t){
  var sign=(t.lines||[]).reduce(function(a,l){return a+l.amount;},0);
  var main=t.kind==='transfer'?fmt(t.amount):(t.lines.length?fmtSigned(t.lines[0].amount):fmt(t.amount));
  if(t.kind==='liability_adjustment')main=fmt(t.amount);
  var tone=sign>0?'inc':sign<0?'exp':'neu';
  var hasCat=(t.kind==='expense'||t.kind==='income')&&t.category;
  var badge=iconBadge(KIND_ICON[t.kind]||'box',tone,hasCat?catColor(t.category):null);
  var title=t.category||t.kind_label; if(t.kind==='expense'&&t.category==='')title=t.jar||t.kind_label;
  var sub=[dmy(t.date),t.kind_label];
  if(t.kind==='transfer'&&t.lines.length===2){ var a=t.lines.filter(function(l){return l.amount<0;})[0],b=t.lines.filter(function(l){return l.amount>0;})[0]; if(a&&b)sub.push(a.wallet+' → '+b.wallet); }
  else if(t.lines.length)sub.push(t.lines[0].wallet);
  if(t.note)sub.push(t.note);
  return h('button',{class:'tap',type:'button',onclick:function(){txnDetail(t);}},[
    h('div',{class:'row has-icon',style:t.reversed?'opacity:.55':null},[
      badge,
      h('div',{class:'l'},[h('div',{class:'t',text:title+(t.reversed?' (đã đảo)':'')}),h('div',{class:'s',text:sub.join(' · ')})]),
      h('div',{class:'r '+(t.kind==='transfer'?'':sign>0?'inc':sign<0?'exp':''),text:main})
    ])]);
}
function txnDetail(t){
  var b=h('div',null,[]);
  function line(k,v){ if(v===''||v===null||v===undefined)return; b.appendChild(h('div',{class:'row'},[h('span',{class:'s',text:k}),h('span',{text:String(v)})])); }
  line('Ngày',dmy(t.date)); line('Loại',t.kind_label); line('Số tiền',fmt(t.amount));
  t.lines.forEach(function(l){ line('Ví: '+l.wallet,fmtSigned(l.amount)); });
  t.debt_lines.forEach(function(l){ line('Dư nợ: '+l.liability,fmtSigned(l.amount)); });
  line('Lọ',t.jar); line('Danh mục',t.category); line('Người chi',t.paid_by); line('Liên quan',t.ref);
  if(t.balance_before!==null&&t.balance_before!==''&&t.kind==='adjustment'){ line('Số dư trước',fmt(t.balance_before)); line('Số dư sau',fmt(t.balance_after)); }
  line('Lý do',t.reason); line('Ghi chú',t.note); line('Người nhập',t.created_by); line('Mã',t.txn_id);
  if(t.reversed)b.appendChild(h('div',{class:'alert info',text:'Giao dịch này đã được đảo.'}));
  var sh;
  if(t.reversible){
    var reason=h('textarea',{id:'rv',placeholder:'Ví dụ: nhập nhầm số tiền'}); var er=errBox();
    b.appendChild(h('h2',{text:'Đảo giao dịch'}));
    b.appendChild(h('div',{class:'hint',text:'Giao dịch gốc được giữ nguyên; hệ thống ghi thêm một bút toán ngược lại, hôm nay.'}));
    b.appendChild(fld('Lý do đảo',reason));
    b.appendChild(er);
    var key=uid();
    b.appendChild(submitBtn('Đảo giao dịch này',function(){
      return api('reverse',{txn_id:t.txn_id,reason:reason.value,key:key}).then(function(){ sh.close(); invalidateCache(); toast('Đã đảo giao dịch'); refresh(); });
    },er));
  }
  sh=openSheet('Chi tiết giao dịch',b);
}

  var d=dateInput('','lrd'), rate=h('input',{type:'number',id:'lrr',min:'0',max:'100',step:'0.01'}), note=h('input',{id:'lrn',maxlength:'200'}), er=errBox(), sh;
  var body=h('div',null,[fld('Ngày áp dụng',d),fld('Lãi suất (%/năm)',rate),fld('Ghi chú',note,'Ví dụ: hết ưu đãi, thả nổi...'),er,
    submitBtn('Lưu',function(){ return api('addLiabilityRate',{liability_id:l.liability_id,effective_date:d.value,rate_percent:rate.value,note:note.value}).then(function(){sh.close();invalidateCache();toast('Đã lưu lãi suất');loanHistorySheet(l);}); },er)]);
  sh=openSheet('Thêm mức lãi suất',body);
}

/* Admin: Danh mục, Lọ ngân sách, Nhắc nhở — mỗi mục màn hình riêng (trước đây gộp chung). */
function renderJars(){
  loading();
  reloadBoot().then(function(){
    var kids=[backBar('Lọ ngân sách')];
    var jc=h('div',{class:'card'});
    S.boot.jars.forEach(function(j){ jc.appendChild(h('div',{class:'row'},[h('div',{class:'t',text:j.name}),h('span',{class:'pill',text:(j.active===1||j.active===true)?'Đang dùng':'Đã tắt'})])); });
    if(!S.boot.jars.length)jc.appendChild(h('div',{class:'empty',text:'Chưa có lọ nào.'}));
    kids.push(jc,h('button',{class:'btn primary block',type:'button',text:'Thêm lọ',onclick:jarForm}));
    $app.replaceChildren.apply($app,kids);
  },function(e){fail(e,renderJars);});
}
function jarForm(){ var n=h('input',{id:'jn',maxlength:'60'}),er=errBox(),sh; sh=openSheet('Thêm lọ',h('div',null,[fld('Tên lọ',n),er,submitBtn('Lưu',function(){return api('saveJar',{name:n.value}).then(function(){sh.close();invalidateCache();renderJars();});},er)])); }
function renderCategories(){
  loading();
  reloadBoot().then(function(){
    var kids=[backBar('Danh mục')];
    var cc=h('div',{class:'card'});
    S.boot.categories.forEach(function(c){ var jn=(S.boot.jars.filter(function(j){return j.jar_id===c.jar_id;})[0]||{}).name; cc.appendChild(h('div',{class:'row',style:(c.active===1||c.active===true)?null:'opacity:.55'},[h('div',{class:'l'},[h('div',{class:'t',text:c.name}),h('div',{class:'s',text:(c.kind==='income'?'Thu nhập':'Chi tiêu'+(jn?' · lọ '+jn:''))})])])); });
    if(!S.boot.categories.length)cc.appendChild(h('div',{class:'empty',text:'Chưa có danh mục nào.'}));
    kids.push(cc,h('button',{class:'btn primary block',type:'button',text:'Thêm danh mục',onclick:catForm}));
    $app.replaceChildren.apply($app,kids);
  },function(e){fail(e,renderCategories);});
}
function catForm(){
  var n=h('input',{id:'cn',maxlength:'60'}), kind=selectEl([{v:'expense',t:'Chi tiêu'},{v:'income',t:'Thu nhập'}],'expense','ck'), jar=selectEl(S.boot.jars.map(function(j){return {v:j.jar_id,t:j.name};}),'','cj'), er=errBox(), sh;
  var jw=fld('Thuộc lọ',jar); kind.addEventListener('change',function(){jw.hidden=kind.value==='income';});
  sh=openSheet('Thêm danh mục',h('div',null,[fld('Tên danh mục',n),fld('Loại',kind),jw,er,submitBtn('Lưu',function(){return api('saveCategory',{name:n.value,kind:kind.value,jar_id:kind.value==='expense'?jar.value:''}).then(function(){sh.close();invalidateCache();renderCategories();});},er)]));
}
function renderReminders(){
  loading();
  api('reminders').then(function(rem){
    var kids=[backBar('Nhắc nhở hằng tháng')];
    var rc=h('div',{class:'card'});
    if(!rem.length)rc.appendChild(h('div',{class:'empty',text:'Chưa có nhắc nhở.'}));
    rem.forEach(function(r){ rc.appendChild(h('div',{class:'row'},[h('div',{class:'l'},[h('div',{class:'t',text:r.title}),h('div',{class:'s',text:'Ngày '+r.day_of_month+' hằng tháng · nhắc trước '+r.days_before+' ngày'})])])); });
    kids.push(rc,h('button',{class:'btn primary block',type:'button',text:'Thêm nhắc nhở',onclick:reminderForm}));
    $app.replaceChildren.apply($app,kids);
  },function(e){fail(e,renderReminders);});
}
function reminderForm(){
  var t=h('input',{id:'rt',maxlength:'80',placeholder:'Ví dụ: Tiền điện, Học phí'}), day=h('input',{id:'rd',inputmode:'numeric',value:'10'}), bef=h('input',{id:'rb',inputmode:'numeric',value:'2'}), er=errBox(), sh;
  sh=openSheet('Thêm nhắc nhở',h('div',null,[fld('Nội dung',t),fld('Ngày trong tháng (1–28)',day),fld('Nhắc trước (ngày)',bef),er,
    submitBtn('Lưu',function(){return api('saveReminder',{type:'monthly_bill',title:t.value,day_of_month:digits(day.value),days_before:digits(bef.value)}).then(function(){sh.close();renderReminders();});},er)]));
}

function renderSystem(){
  loading();
  Promise.all([api('health'),reloadBoot()]).then(function(res){
    var hv=res[0];
    var er=errBox(), out=h('div',null,[]);
    var wp=h('input',{id:'sw',inputmode:'numeric',value:S.boot.settings.budget_warn_pct}), de=h('input',{id:'sd',inputmode:'numeric',value:S.boot.settings.data_entry_days}), er2=errBox();
    var kids=[backBar('Hệ thống'),h('div',{class:'card'},[
      h('div',{class:'row'},[h('span',{class:'s',text:'Kiểm tra toàn vẹn gần nhất'}),h('span',{text:hv.last_integrity||'chưa chạy'})]),
      h('div',{class:'row'},[h('span',{class:'s',text:'Sao lưu tuần'}),h('span',{text:hv.last_backup_weekly||'chưa chạy'})]),
      h('div',{class:'row'},[h('span',{class:'s',text:'Sao lưu tháng (Excel)'}),h('span',{text:hv.last_backup_monthly||'chưa chạy'})]),
      h('div',{class:'row'},[h('span',{class:'s',text:'Phiên bản'}),h('span',{text:Object.keys(hv.version||{}).map(function(k){return k+' '+hv.version[k];}).join(' · ')})])]),
      submitBtn('Kiểm tra toàn vẹn ngay',function(){ return api('runIntegrity').then(function(r){ out.replaceChildren(h('div',{class:'alert '+(r.ok?'info':'over'),text:r.ok?'Đạt: '+r.counts.txns+' giao dịch, sổ cái nhất quán.':'Phát hiện '+r.issues.length+' bất thường:'})); r.issues.slice(0,20).forEach(function(i){out.appendChild(h('div',{class:'hint',text:'• '+(i.msg||i.code)}));}); }); },er),er,out,
      h('div',{class:'hint',style:'margin-top:12px',text:'Dữ liệu nằm trong Google Sheet gốc. Hệ thống tự sao lưu hằng tuần/tháng vào Google Drive. Sửa tay trực tiếp trong Sheet có thể làm lệch sổ cái; hãy nhập qua ứng dụng.'}),
      h('h2',{text:'Cài đặt'}),
      h('div',{class:'card'},[fld('Cảnh báo ngân sách khi dùng từ (%)',wp),fld('Nhắc nhập thu chi sau số ngày không có giao dịch',de),er2,
        submitBtn('Lưu cài đặt',function(){ return api('saveSettings',{budget_warn_pct:digits(wp.value),data_entry_days:digits(de.value)}).then(function(){toast('Đã lưu cài đặt');return reloadBoot();}); },er2)])];
    $app.replaceChildren.apply($app,kids);
  },function(e){fail(e,renderSystem);});
}

/* ---------- navigation ---------- */
// Các mục Ví / Tài sản / Khoản vay / Sổ nợ (side:true) là "module riêng": luôn có route/go() của
// riêng mình nhưng chỉ hiện trên sidebar desktop (CSS .side-only), không chiếm chỗ thanh dưới trên
// điện thoại — trên điện thoại các mục này vẫn mở được qua các lối tắt ở Tổng quan.
var TABS=[['home','Tổng quan','home'],['history','Lịch sử','list'],['add','Nhập','plus'],['budget','Ngân sách','jar'],
  ['wallets','Ví','bank',true],['assets','Tài sản','box',true],['loans','Khoản vay','card',true],['debts','Sổ nợ','people',true],
  ['more','Admin','gear']];
function drawNav(){
  var nav=document.getElementById('nav'); nav.replaceChildren();
  TABS.forEach(function(t){
    var cls=[t[0]==='add'?'add':null,t[3]?'side-only':null].filter(Boolean).join(' ')||null;
    var b=h('button',{type:'button',class:cls,'aria-current':S.tab===t[0]?'page':null,'aria-label':t[1],onclick:function(){ if(t[0]==='more')S.view.more=null; if(t[0]==='add'){S.view.assets=null;} go(t[0]); }});
    if(t[0]==='add')b.appendChild(h('span',{class:'fab'},[svg(ICON[t[2]])])); else b.appendChild(svg(ICON[t[2]]));
    b.appendChild(h('span',{text:t[1]})); nav.appendChild(b);
  });
}
function go(tab){ S.tab=tab; drawNav(); window.scrollTo(0,0); refresh(); }
function refresh(){
  ({home:renderHome,history:renderHistory,add:renderAdd,budget:renderBudget,wallets:renderWallets,assets:renderAssetsTab,loans:renderLoansTab,debts:renderDebts,more:renderMore})[S.tab]();
}

/* ---------- start ---------- */
loadCacheLS();
loading(); drawNav();
reloadBoot().then(function(){ refresh(); prefetchAll(); },function(e){ fail(e,function(){location.reload();}); });
window.__ff={S:S,go:go};
})();
</script>
